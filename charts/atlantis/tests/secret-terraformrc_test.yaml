---
suite: test secret-terraformrc for terraformrc
templates:
  - secret-terraformrc.yaml
release:
  name: my-release
tests:
  - it: default values
    asserts:
      - hasDocuments:
          count: 0
  - it: terraformrcSecretName
    set:
      terraformrcSecretName: 'atlantis-terraformrc'
    asserts:
      - hasDocuments:
          count: 0
  - it: terraformrc
    set:
      terraformrc: |
        credentials "app.terraform.io" {
          token = "YOUR_TOKEN"
        }
      commonLabels:
        team: "infra"
      secret:
        annotations:
          team: "infra"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - isAPIVersion:
          of: v1
      - equal:
          path: metadata.name
          value: my-release-atlantis-terraformrc
      - equal:
          path: data["terraformrc"]
          value: Y3JlZGVudGlhbHMgImFwcC50ZXJyYWZvcm0uaW8iIHsKICB0b2tlbiA9ICJZT1VSX1RPS0VOIgp9Cg==
      - equal:
          path: metadata.labels.team
          value: infra
      - equal:
          path: metadata.annotations.team
          value: infra
