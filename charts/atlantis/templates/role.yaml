{{- if .Values.enableKubernetesBackend }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "atlantis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atlantis.labels" . | nindent 4 }}
  {{- with .Values.extraAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
      - delete
  # The Terraform Kubernetes backend stores state in Secrets whose names it picks at
  # runtime, so these rules cannot be narrowed with resourceNames. The verbs are listed
  # explicitly instead of "*" so the role does not also grant deletecollection, or any
  # verb added to the API in future. This is still read access to every Secret in the
  # namespace, so give Atlantis a namespace of its own.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
{{- end }}
